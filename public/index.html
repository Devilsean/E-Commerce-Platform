<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精品商城</title>
    <!-- 模块化CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/sales-report.css">
    <link rel="stylesheet" href="css/customer-management.css">
</head>

<body>
    <!-- SVG图标库 -->
    <div style="display: none;">
        <object data="icons.svg" type="image/svg+xml" id="svg-icons"></object>
    </div>

    <div id="app">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="container">
                <div class="nav-brand" onclick="app.router.navigate('/')" style="cursor:pointer;">
                    <svg width="24" height="24" class="icon" aria-hidden="true">
                        <use xlink:href="#icon-cart"></use>
                    </svg>
                    精品商城
                </div>
                <div class="nav-search">
                    <input type="text" id="navSearchInput" placeholder="搜索商品..." class="nav-search-input">
                    <button class="nav-search-btn" onclick="app.navSearch()">
                        搜索
                    </button>
                </div>
                <div class="nav-menu">
                    <a href="#/cart" class="nav-link">购物车 <span id="cartCount" class="badge">0</span></a>
                    <a href="#/profile" class="nav-link" id="profileNav" style="display:none;">个人中心</a>
                    <a href="#/login" class="nav-link" id="loginNav">登录</a>
                    <button class="btn btn-sm" id="logoutBtn" style="display:none;" onclick="app.logout()">退出</button>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main id="main-content" class="container">
            <!-- 动态内容将在这里渲染 -->
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-grid">
                    <!-- 品牌信息 -->
                    <div class="footer-brand">
                        <div class="footer-logo">
                            <svg width="24" height="24" class="icon" aria-hidden="true">
                                <use xlink:href="#icon-cart"></use>
                            </svg>
                            精品商城
                        </div>
                        <p class="footer-description">
                            优质商品，贴心服务<br>
                            让购物更简单，让生活更美好
                        </p>
                        <div class="footer-social">
                            <span class="footer-social-title">关注我们</span>
                            <div class="footer-social-icons">
                                <a href="#" class="social-icon" title="微信公众号">
                                    <img src="https://img.icons8.com/?size=100&id=38288&format=png" width="20"
                                        height="20" alt="微信公众号">
                                </a>
                                <a href="#" class="social-icon" title="微博">
                                    <img src="https://img.icons8.com/?size=100&id=38497&format=png" width="20"
                                        height="20" alt="微博">
                                </a>
                                <a href="#" class="social-icon" title="抖音">
                                    <img src="https://ouch-prod-var-cdn.icons8.com/kb/illustrations/thumbs/uxNTZHRHdNesPdIr.webp"
                                        width="20" height="20" alt="抖音">
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- 购物指南 -->
                    <div class="footer-section">
                        <h3 class="footer-title">购物指南</h3>
                        <div class="footer-links">
                            <a href="#/help/order" class="footer-link">购物流程</a>
                            <a href="#/help/payment" class="footer-link">支付方式</a>
                            <a href="#/help/return" class="footer-link">退换货政策</a>
                            <a href="#/help/faq" class="footer-link">常见问题</a>
                        </div>
                    </div>

                    <!-- 客户服务 -->
                    <div class="footer-section">
                        <h3 class="footer-title">客户服务</h3>
                        <div class="footer-links">
                            <a href="#/profile" class="footer-link">个人中心</a>
                            <a href="#/cart" class="footer-link">购物车</a>
                            <a href="#/" class="footer-link">商品分类</a>
                        </div>
                    </div>

                    <!-- 联系我们 -->
                    <div class="footer-section">
                        <h3 class="footer-title">联系我们</h3>
                        <div class="footer-contact">
                            <div class="footer-contact-item">
                                <svg width="16" height="16" class="icon">
                                    <use xlink:href="#icon-phone"></use>
                                </svg>
                                <span>400-888-8888</span>
                            </div>
                            <div class="footer-contact-item">
                                <svg width="16" height="16" class="icon">
                                    <use xlink:href="#icon-mail"></use>
                                </svg>
                                <span>service@shop.com</span>
                            </div>
                            <div class="footer-contact-item">
                                <svg width="16" height="16" class="icon">
                                    <use xlink:href="#icon-clock"></use>
                                </svg>
                                <span>工作时间：9:00-18:00</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 页脚底部 -->
                <div class="footer-bottom">
                    <div class="footer-copyright">
                        © 2025 精品商城 · All Rights Reserved · 京ICP备12345678号
                    </div>
                    <div class="footer-links-bottom">
                        <a href="#/about">关于我们</a>
                        <span class="separator">·</span>
                        <a href="#/terms">服务条款</a>
                        <span class="separator">·</span>
                        <a href="#/privacy">隐私政策</a>
                        <span class="separator">·</span>
                        <a href="#/help/faq">帮助中心</a>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Toast 提示 -->
        <div id="toast" class="toast"></div>

        <!-- Loading 遮罩 -->
        <div id="loading" class="loading-overlay" style="display:none;">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- SVG图标库 -->
    <script src="js/icons.js"></script>

    <!-- 基础模块 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/router.js"></script>
    <script src="js/store.js"></script>

    <!-- 功能模块 -->
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/product.js"></script>
    <script src="js/product-detail.js"></script>
    <script src="js/merchant.js"></script>
    <script src="js/merchant-stats.js"></script>
    <script src="js/account-deletion.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/review.js"></script>
    <script src="js/image-viewer.js"></script>
    <script src="js/order.js"></script>
    <script src="js/sales-report.js"></script>
    <script src="js/customer-management.js"></script>

    <!-- 主应用 -->
    <script src="app.js"></script>
</body>

</html>
