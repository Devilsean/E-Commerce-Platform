<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精品商城</title>
    <!-- 模块化CSS -->
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <!-- SVG图标库 -->
    <div style="display: none;">
        <object data="icons.svg" type="image/svg+xml" id="svg-icons"></object>
    </div>

    <div id="app">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="container">
                <div class="nav-brand" onclick="app.router.navigate('/')" style="cursor:pointer;">
                    <svg width="24" height="24" class="icon" aria-hidden="true">
                        <use xlink:href="#icon-cart"></use>
                    </svg>
                    精品商城
                </div>
                <div class="nav-search">
                    <input type="text" id="navSearchInput" placeholder="搜索商品..." class="nav-search-input">
                    <button class="nav-search-btn" onclick="app.navSearch()">
                        搜索
                    </button>
                </div>
                <div class="nav-menu">
                    <a href="#/cart" class="nav-link">购物车 <span id="cartCount" class="badge">0</span></a>
                    <a href="#/profile" class="nav-link" id="profileNav" style="display:none;">个人中心</a>
                    <a href="#/login" class="nav-link" id="loginNav">登录</a>
                    <button class="btn btn-sm" id="logoutBtn" style="display:none;" onclick="app.logout()">退出</button>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main id="main-content" class="container">
            <!-- 动态内容将在这里渲染 -->
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-grid">
                    <!-- 品牌信息 -->
                    <div class="footer-brand">
                        <div class="footer-logo">
                            <svg width="28" height="28" class="icon" aria-hidden="true">
                                <use xlink:href="#icon-cart"></use>
                            </svg>
                            精品商城
                        </div>
                        <p class="footer-description">
                            致力于为您提供优质的商品和服务，打造最佳的购物体验。正品保证，全国包邮，7天无理由退换货。
                        </p>
                        <div class="footer-social">
                            <a href="#" class="social-link" title="微信">
                                <svg width="20" height="20" class="icon">
                                    <use xlink:href="#icon-wechat"></use>
                                </svg>
                            </a>
                            <a href="#" class="social-link" title="微博">
                                <svg width="20" height="20" class="icon">
                                    <use xlink:href="#icon-weibo"></use>
                                </svg>
                            </a>
                            <a href="#" class="social-link" title="QQ">
                                <svg width="20" height="20" class="icon">
                                    <use xlink:href="#icon-qq"></use>
                                </svg>
                            </a>
                        </div>
                    </div>

                    <!-- 购物指南 -->
                    <div class="footer-section">
                        <h3 class="footer-title">购物指南</h3>
                        <div class="footer-links">
                            <a href="#/help/order" class="footer-link">购物流程</a>
                            <a href="#/help/payment" class="footer-link">支付方式</a>
                            <a href="#/help/delivery" class="footer-link">配送说明</a>
                            <a href="#/help/return" class="footer-link">退换货政策</a>
                        </div>
                    </div>

                    <!-- 客户服务 -->
                    <div class="footer-section">
                        <h3 class="footer-title">客户服务</h3>
                        <div class="footer-links">
                            <a href="#/help/faq" class="footer-link">常见问题</a>
                            <a href="#/help/contact" class="footer-link">联系我们</a>
                            <a href="#/help/feedback" class="footer-link">意见反馈</a>
                            <a href="#/help/complaint" class="footer-link">投诉建议</a>
                        </div>
                    </div>

                    <!-- 联系方式 -->
                    <div class="footer-section">
                        <h3 class="footer-title">联系我们</h3>
                        <div class="footer-contact-item">
                            <svg width="16" height="16" class="icon">
                                <use xlink:href="#icon-phone"></use>
                            </svg>
                            <span>400-888-8888</span>
                        </div>
                        <div class="footer-contact-item">
                            <svg width="16" height="16" class="icon">
                                <use xlink:href="#icon-mail"></use>
                            </svg>
                            <span>service@shop.com</span>
                        </div>
                        <div class="footer-contact-item">
                            <svg width="16" height="16" class="icon">
                                <use xlink:href="#icon-location"></use>
                            </svg>
                            <span>中国·北京市朝阳区</span>
                        </div>
                    </div>
                </div>

                <!-- 页脚底部 -->
                <div class="footer-bottom">
                    <div class="footer-copyright">
                        © 2024 精品商城. All rights reserved.
                    </div>
                    <div class="footer-links-bottom">
                        <a href="#/privacy">隐私政策</a>
                        <a href="#/terms">服务条款</a>
                        <a href="#/about">关于我们</a>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Toast 提示 -->
        <div id="toast" class="toast"></div>

        <!-- Loading 遮罩 -->
        <div id="loading" class="loading-overlay" style="display:none;">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- SVG图标库 -->
    <script src="js/icons.js"></script>

    <!-- 基础模块 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/router.js"></script>
    <script src="js/store.js"></script>

    <!-- 功能模块 -->
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/product.js"></script>
    <script src="js/product-detail.js"></script>
    <script src="js/merchant.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/review.js"></script>
    <script src="js/image-viewer.js"></script>
    <script src="js/order.js"></script>

    <!-- 主应用 -->
    <script src="app.js"></script>
</body>

</html>
